[project]
name = "backend"
version = "0.1.0"
description = "AI customer-support copilot — Stage 0 evals and later FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
    "tenacity>=9.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
