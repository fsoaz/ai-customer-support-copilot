[project]
name = "backend"
version = "0.1.0"
description = "AI customer-support copilot — Stage 0 evals and later FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
    "tenacity>=9.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Hand-authored eval questions are long by design.
"evals/scripts/build_golden.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
